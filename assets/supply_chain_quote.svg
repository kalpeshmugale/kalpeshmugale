<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card { fill: #262d3d; }
      .quote-mark { fill: #7dd3fc; font-family: 'Georgia', serif; font-weight: bold; }
      .quote-text { fill: #bae6fd; font-family: 'Comic Sans MS', 'Segoe Print', cursive; font-style: italic; font-size: 28px; }
      .attribution { fill: #55627a; font-family: 'Comic Sans MS', 'Segoe Print', cursive; font-style: italic; font-size: 24px; }
    </style>
  </defs>

  <rect class="card" x="0" y="0" width="1200" height="280" rx="14" />

  <text class="quote-mark" x="40" y="70" font-size="60">&#8220;</text>

  <text class="quote-text" x="55" y="90">They call it a "soft skill" role until the supply</text>
  <text class="quote-text" x="55" y="130">chain breaks, and suddenly it's the only</text>
  <text class="quote-text" x="55" y="170">thing anyone's talking about.</text>

  <text class="quote-mark" x="780" y="200" font-size="60" text-anchor="end">&#8221;</text>

  <text class="attribution" x="1150" y="240" text-anchor="end">- 2020 Taught You Nothing</text>
</svg>
